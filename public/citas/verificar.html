<!--public/citas/verificar.html-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citas — Verificar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <script src="js/qrcode.min.js"></script>
  <link rel="stylesheet" href="css/verificar.css"/>
   <script src="../personalizacion/js/config.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    
    <span class="step-indicator">Paso 5 de 5</span>
  </header>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="steps-track">
      <div class="step-item done">
        <div class="step-circle"><i class="bi bi-check"></i></div>
        <div class="step-label">Agenda</div>
      </div>
      <div class="step-connector done"></div>
      <div class="step-item done">
        <div class="step-circle"><i class="bi bi-check"></i></div>
        <div class="step-label">Datos</div>
      </div>
      <div class="step-connector done"></div>
      <div class="step-item done">
        <div class="step-circle"><i class="bi bi-check"></i></div>
        <div class="step-label">Vehículo</div>
      </div>
      <div class="step-connector done"></div>
      <div class="step-item done">
        <div class="step-circle"><i class="bi bi-check"></i></div>
        <div class="step-label">Docs</div>
      </div>
      <div class="step-connector done"></div>
      <div class="step-item active">
        <div class="step-circle">5</div>
        <div class="step-label">Verificar</div>
      </div>
    </div>
  </div>

  <div class="main-wrap">

    <!-- RESUMEN -->
    <div id="resumenCard">
      <div id="resumenContenido"></div>

      <div class="action-row">
        <a class="btn-secondary" href="documentacion.html">
          <i class="bi bi-chevron-left"></i> Regresar
        </a>
        <button class="btn-primary green" id="btnGuardar" onclick="guardar()">
          <i class="bi bi-check-lg"></i> Guardar y Generar Oficio
        </button>
      </div>
    </div>

    <!-- ÉXITO -->
<div id="successCard" style="display:none;">
  <div class="success-screen">
    <div class="success-icon">
      <i class="bi bi-hourglass-split" style="color:#f5a623;"></i>
    </div>
    <h2 class="success-title">Solicitud enviada</h2>
    <p class="success-sub">Tu solicitud fue recibida por el área de <strong id="areaDisplay">—</strong>.</p>
    <p class="success-sub">Recibirás un correo cuando sea confirmada o rechazada.</p>
    <div class="success-actions">
      <a class="btn-primary" href="agenda.html">
        <i class="bi bi-plus-lg"></i> Nueva Cita
      </a>
    </div>
  </div>
</div>

  </div>

  <p class="app-footer">VehiLog · Sistema de Control Vehicular · v1.1</p>
  <script src="js/verificar.js"></script>
</body>
</html>
