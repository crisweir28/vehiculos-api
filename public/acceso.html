<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VehiLog — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <script src="personalizacion/js/config.js"></script>
  <link rel="stylesheet" href="css/acceso.css"/>
  <script src="js/permiso.js"></script>
</head>
<body>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-wrap">

    <!-- RELOJ -->
    <div class="clock-block">
      <div class="clock" id="reloj">--:--</div>
      <div class="clock-date" id="fecha">—</div>
    </div>

    <!-- ACCIONES -->
    <div class="action-stack">
      <a class="action-btn entrada" href="entrada.html">
        <i class="bi bi-arrow-down-circle"></i> Entrada
      </a>
      <a class="action-btn salida" href="salida.html">
        <i class="bi bi-arrow-up-circle"></i> Salida
      </a>
    </div>

  </main>

  <script src="js/navbar.js"></script>
  <script>
    cargarNavbar({ titulo: 'Inicio' });

    // Reloj en tiempo real
    function actualizarReloj() {
      const ahora = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('reloj').textContent =
        `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`;
      document.getElementById('fecha').textContent =
        ahora.toLocaleDateString('es-MX', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
    }
    actualizarReloj();
    setInterval(actualizarReloj, 1000);
  </script>

</body>
</html>
